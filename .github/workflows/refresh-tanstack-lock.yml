name: Refresh patched TanStack lockfile

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-tanstack-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Resolve patched TanStack dependencies
        run: npm install @tanstack/react-start@^1.168.60 --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-online
        working-directory: ${{ github.workspace }}
      - name: Commit updated lockfile
        working-directory: ${{ github.workspace }}
        run: |
          cd "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
          else
            git commit -m "Update TanStack Start to patched dependency tree"
            git push
          fi
