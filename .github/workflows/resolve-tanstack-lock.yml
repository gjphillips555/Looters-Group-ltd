name: Resolve patched TanStack dependency tree

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/resolve-tanstack-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    container: node:22
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Update TanStack packages and lockfile
        run: |
          cd "$GITHUB_WORKSPACE"
          npm update @tanstack/react-start --package-lock-only --ignore-scripts --no-audit --no-fund --prefer-online
          node -e "const p=require('./package-lock.json'); console.log('react-start',p.packages['node_modules/@tanstack/react-start']?.version,'server-core',p.packages['node_modules/@tanstack/start-server-core']?.version)"
      - name: Commit lockfile
        run: |
          cd "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes"
          else
            git commit -m "Update TanStack Start to patched dependency tree"
            git push
          fi
